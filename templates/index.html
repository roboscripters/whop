<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whop Clipper — Auto Hook Finder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0f0f14;
    color: #f0f0f5;
    padding: 20px;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #9a9aa5; font-size: 14px; margin-top: 0; margin-bottom: 24px; }
  .card {
    background: #1a1a22;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #2a2a35;
  }
  label { display: block; font-size: 14px; margin-bottom: 8px; color: #c5c5d0; }
  input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #24242e;
    border: 1px dashed #3a3a48;
    border-radius: 10px;
    color: #f0f0f5;
    margin-bottom: 16px;
  }
  input[type="range"] { width: 100%; }
  .range-val { text-align: center; font-size: 18px; font-weight: 600; margin: 8px 0 16px; color: #7c9fff; }
  button {
    width: 100%;
    padding: 14px;
    background: #5b6cff;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #3a3a48; }

  .mode-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode-toggle button {
    flex: 1;
    background: #24242e;
    color: #9a9aa5;
    font-size: 13px;
  }
  .mode-toggle button.active { background: #5b6cff; color: white; }

  .crop-toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #24242e;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .crop-toggle-row label {
    font-size: 13px;
    color: #c5c5d0;
    flex: 1;
    margin-right: 10px;
  }
  .crop-toggle-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: #5b6cff;
  }

  #progressCard { display: none; }
  .stage-label {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
    color: #f0f0f5;
  }
  .progress-track {
    width: 100%;
    height: 10px;
    background: #24242e;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #5b6cff, #7c9fff);
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-pct { text-align: center; font-size: 13px; color: #9a9aa5; }
  .steps {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 11px;
    color: #5a5a68;
  }
  .steps span.active { color: #7c9fff; font-weight: 600; }
  .steps span.complete { color: #4ade80; }

  #errorBox {
    display: none;
    background: #2a1a1a;
    border: 1px solid #4a2a2a;
    color: #ff9a9a;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 16px;
  }

  #resultsHeader {
    display: none;
    font-size: 14px;
    color: #9a9aa5;
    margin: 20px 0 10px;
  }
  .clip-card { display: none; }
  .clip-card video { width: 100%; border-radius: 12px; }
  .clip-number {
    font-size: 12px;
    color: #7c9fff;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .meta { font-size: 13px; color: #9a9aa5; margin-top: 10px; line-height: 1.6; }
  a.download-btn {
    display: block;
    text-align: center;
    margin-top: 12px;
    padding: 12px;
    background: #24242e;
    border-radius: 10px;
    color: #7c9fff;
    text-decoration: none;
    font-weight: 600;
  }

  .hook-box {
    margin-top: 16px;
    background: #1e2440;
    border: 1px solid #3a4a8a;
    border-radius: 12px;
    padding: 14px;
  }
  .hook-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #7c9fff;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hook-vibe-tag {
    background: #2a2a45;
    color: #9db3ff;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    text-transform: capitalize;
  }
  .hook-text {
    font-size: 17px;
    font-weight: 700;
    color: #f0f0f5;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  button.copy-hook-btn {
    background: #5b6cff;
    padding: 10px;
    font-size: 13px;
  }
  button.copy-hook-btn.copied {
    background: #2d5a3d;
    color: #4ade80;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Whop Clipper</h1>
  <p class="sub">Upload a trailer or podcast — get back the best clip(s), auto-cut, with matching hooks.</p>

  <div class="card" id="uploadCard">
    <div class="mode-toggle">
      <button id="modeTrailerBtn" class="active">Trailer (1 clip)</button>
      <button id="modePodcastBtn">Podcast (multi-clip)</button>
    </div>

    <label for="video">Video file (up to ~2GB)</label>
    <input type="file" id="video" accept="video/*">

    <label for="cliplen">Clip length: <span class="range-val" id="cliplenVal">30s</span></label>
    <input type="range" id="cliplen" min="15" max="60" value="30" step="5">

    <div id="clipCountRow" style="display:none;">
      <label for="clipcount">Number of clips: <span class="range-val" id="clipcountVal">3</span></label>
      <input type="range" id="clipcount" min="3" max="5" value="3" step="1">
    </div>

    <div class="crop-toggle-row">
      <label for="verticalCrop" style="margin-bottom:0;">Vertical crop (9:16 for Reels/Shorts)</label>
      <input type="checkbox" id="verticalCrop" checked>
    </div>

    <div class="crop-toggle-row">
      <label for="burnCaptions" style="margin-bottom:0;">Burn in captions + smarter hooks (uses transcription, slower)</label>
      <input type="checkbox" id="burnCaptions">
    </div>

    <button id="processBtn">Find Best Clip(s)</button>
  </div>

  <div class="card" id="progressCard">
    <div class="stage-label" id="stageLabel">Starting…</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-pct" id="progressPct">0%</div>
    <div class="steps">
      <span data-stage="transcribe">Transcribe</span>
      <span data-stage="audio">Audio</span>
      <span data-stage="motion">Motion</span>
      <span data-stage="scoring">Scoring</span>
      <span data-stage="cutting">Cutting</span>
    </div>
    <div id="errorBox"></div>
  </div>

  <div id="resultsHeader"></div>
  <div id="resultsContainer"></div>
</div>

<script>
const cliplenInput = document.getElementById('cliplen');
const cliplenVal = document.getElementById('cliplenVal');
cliplenInput.addEventListener('input', () => {
  cliplenVal.textContent = cliplenInput.value + 's';
});

const clipcountInput = document.getElementById('clipcount');
const clipcountVal = document.getElementById('clipcountVal');
clipcountInput.addEventListener('input', () => {
  clipcountVal.textContent = clipcountInput.value;
});

// ---- Mode toggle (trailer = 1 clip, podcast = multi-clip) ----
const modeTrailerBtn = document.getElementById('modeTrailerBtn');
const modePodcastBtn = document.getElementById('modePodcastBtn');
const clipCountRow = document.getElementById('clipCountRow');
let currentMode = 'trailer';

modeTrailerBtn.addEventListener('click', () => {
  currentMode = 'trailer';
  modeTrailerBtn.classList.add('active');
  modePodcastBtn.classList.remove('active');
  clipCountRow.style.display = 'none';
});
modePodcastBtn.addEventListener('click', () => {
  currentMode = 'podcast';
  modePodcastBtn.classList.add('active');
  modeTrailerBtn.classList.remove('active');
  clipCountRow.style.display = 'block';
});

const progressCard = document.getElementById('progressCard');
const stageLabel = document.getElementById('stageLabel');
const progressFill = document.getElementById('progressFill');
const progressPct = document.getElementById('progressPct');
const errorBox = document.getElementById('errorBox');
const resultsHeader = document.getElementById('resultsHeader');
const resultsContainer = document.getElementById('resultsContainer');

function stageKey(stage) {
  const s = stage.toLowerCase();
  if (s.includes('transcrib')) return 'transcribe';
  if (s.includes('audio')) return 'audio';
  if (s.includes('motion')) return 'motion';
  if (s.includes('scoring') || s.includes('segment') || s.includes('subject')) return 'scoring';
  if (s.includes('cutting')) return 'cutting';
  return null;
}

function updateSteps(currentKey) {
  const order = ['transcribe', 'audio', 'motion', 'scoring', 'cutting'];
  const currentIdx = order.indexOf(currentKey);
  document.querySelectorAll('.steps span').forEach(el => {
    const key = el.dataset.stage;
    const idx = order.indexOf(key);
    el.classList.remove('active', 'complete');
    if (currentIdx === -1) return;
    if (idx < currentIdx) el.classList.add('complete');
    else if (idx === currentIdx) el.classList.add('active');
  });
}

function renderClips(clips, sourceDuration) {
  resultsContainer.innerHTML = '';
  resultsHeader.style.display = 'block';
  resultsHeader.textContent = `${clips.length} clip${clips.length > 1 ? 's' : ''} found from a ${sourceDuration}s source`;

  clips.forEach((clip, idx) => {
    const card = document.createElement('div');
    card.className = 'card clip-card';
    card.style.display = 'block';

    const number = document.createElement('div');
    number.className = 'clip-number';
    number.textContent = `CLIP ${idx + 1} OF ${clips.length}`;
    card.appendChild(number);

    const video = document.createElement('video');
    video.controls = true;
    video.src = clip.download_url;
    card.appendChild(video);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `Taken from ${clip.start_time}s–${clip.end_time}s (${clip.duration}s clip).`;
    card.appendChild(meta);

    const hookBox = document.createElement('div');
    hookBox.className = 'hook-box';
    const quoteBadge = clip.hook_is_quote
      ? '<span class="hook-vibe-tag" style="background:#2d5a3d;color:#4ade80;margin-right:6px;">real quote</span>'
      : '';
    hookBox.innerHTML = `
      <div class="hook-label">
        <span>Suggested Hook</span>
        <span>${quoteBadge}<span class="hook-vibe-tag">${clip.vibe}</span></span>
      </div>
      <div class="hook-text">${clip.hook}</div>
      <button class="copy-hook-btn">Copy Hook</button>
    `;
    const copyBtn = hookBox.querySelector('.copy-hook-btn');
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(clip.hook).then(() => {
        copyBtn.textContent = 'Copied ✓';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy Hook';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    });
    card.appendChild(hookBox);

    const downloadLink = document.createElement('a');
    downloadLink.className = 'download-btn';
    downloadLink.href = clip.download_url;
    downloadLink.download = '';
    downloadLink.textContent = '⬇ Download Clip';
    card.appendChild(downloadLink);

    resultsContainer.appendChild(card);
  });
}

let pollTimer = null;

async function pollStatus(jobId) {
  try {
    const res = await fetch('/status/' + jobId);
    const data = await res.json();

    if (data.error) {
      showError(data.error);
      return;
    }

    const pct = data.progress || 0;
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    stageLabel.textContent = data.stage || 'Processing…';
    updateSteps(stageKey(data.stage || ''));

    if (data.status === 'done') {
      clearInterval(pollTimer);
      stageLabel.textContent = 'Done!';
      renderClips(data.clips, data.source_duration);
    } else if (data.status === 'error') {
      clearInterval(pollTimer);
      showError(data.error || 'Something went wrong during processing.');
    }
  } catch (err) {
    // transient network hiccup, keep polling
  }
}

function showError(msg) {
  errorBox.style.display = 'block';
  errorBox.textContent = '⚠ ' + msg;
  document.getElementById('processBtn').disabled = false;
}

document.getElementById('processBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('video');
  const btn = document.getElementById('processBtn');

  if (!fileInput.files.length) {
    alert('Pick a video first.');
    return;
  }

  const nClips = currentMode === 'podcast' ? clipcountInput.value : 1;
  const verticalCrop = document.getElementById('verticalCrop').checked;
  const burnCaptions = document.getElementById('burnCaptions').checked;

  const formData = new FormData();
  formData.append('video', fileInput.files[0]);
  formData.append('clip_len', cliplenInput.value);
  formData.append('n_clips', nClips);
  formData.append('vertical_crop', verticalCrop);
  formData.append('burn_captions', burnCaptions);

  btn.disabled = true;
  errorBox.style.display = 'none';
  resultsHeader.style.display = 'none';
  resultsContainer.innerHTML = '';
  progressCard.style.display = 'block';
  stageLabel.textContent = 'Uploading…';
  progressFill.style.width = '0%';
  progressPct.textContent = '0%';
  updateSteps(null);

  try {
    const res = await fetch('/process', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.error) {
      showError(data.error);
      return;
    }

    pollTimer = setInterval(() => pollStatus(data.job_id), 3000);
  } catch (err) {
    showError('Upload failed: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
